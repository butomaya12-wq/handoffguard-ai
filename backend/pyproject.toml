[project]
name = "handoffguard-backend"
version = "0.1.0"
description = "HandoffGuard AI backend API (educational MVP)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
# Installed only for PostgreSQL-backed deployment or disposable CI integration tests.
postgres = ["psycopg[binary]>=3.2,<4"]
# The public educational demo adds a signed, HttpOnly access-cookie perimeter.
cloud = ["psycopg[binary]>=3.2,<4", "itsdangerous>=2.2,<3"]
# Local-only opt-in telemetry stack; not installed in the default cloud build.
observability = ["opentelemetry-sdk>=1.35,<2", "opentelemetry-exporter-otlp-proto-http>=1.35,<2", "prometheus-client>=0.21,<1"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["tests", "tests.*", "integration_tests", "integration_tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
