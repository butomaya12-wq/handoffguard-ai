openapi: 3.1.0
info:
  title: HandoffGuard AI API
  version: 0.3.0-draft
  description: |
    Contract for a synthetic B2B manufacturing change-impact and approval demo.
    Contract includes implemented Gate 01, V1 history, and sales-recorded customer acceptance / V2 application. Source ingestion remains planned.
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []
tags:
  - name: orders
  - name: production
  - name: changes
  - name: approval
  - name: analytics
  - name: authentication
paths:
  /api/v1/me:
    get:
      tags: [authentication]
      operationId: getCurrentSession
      summary: Return validated role for a single authenticated session
      description: Never returns token, server-side actor ID, or other credentials.
      responses:
        '200':
          description: Server-validated role
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role:
                    type: string
                    enum: [sales, production, approver]
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/analytics/changes:
    get:
      tags: [analytics]
      operationId: listChangeAnalytics
      summary: Read-only synthetic-demo workflow counts and a bounded filtered change list
      description: |
        Requires a bearer token for sales or company approver, and the cloud reviewer gate
        when hosted. Aggregates all synthetic change records; this demo has no tenant
        separation or change-created timestamp. Filtering affects the table only.
        Rows are UUID-ordered, not chronological. No customer text or actor details.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChangeStatus'
      responses:
        '200':
          description: Unfiltered KPI counts and at most 25 limited details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeAnalyticsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create approved baseline order revision 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Approved baseline created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get currently approved order revision
      responses:
        '200':
          description: Current approved order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orders/{order_id}/revisions:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [orders]
      operationId: listOrderRevisions
      summary: List saved approved versions of the order (not draft changes)
      responses:
        '200':
          description: Approved revisions, ordered oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderRevision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orders/{order_id}/production-reviews:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [production]
      operationId: recordProductionReview
      summary: Production reviewer records progress and feasibility
      description: Only the authenticated production reviewer role is authorized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionReviewInput'
      responses:
        '201':
          description: Immutable production review saved; older assessments become stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionReview'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/orders/{order_id}/changes:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [changes]
      operationId: listOrderChanges
      summary: Resume saved proposal and approval workflow after a UI reload (sales or approver)
      responses:
        '200':
          description: Saved proposals, assessment snapshots and matching customer acceptance flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChangeWorkflow'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [changes]
      operationId: createChange
      summary: Record proposed change without mutating approved order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeInput'
      responses:
        '201':
          description: Change draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/changes/{change_id}:
    parameters:
      - $ref: '#/components/parameters/ChangeId'
    get:
      tags: [changes]
      operationId: getChange
      responses:
        '200':
          description: Proposed change and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/changes/{change_id}/sources:
    parameters:
      - $ref: '#/components/parameters/ChangeId'
    post:
      tags: [changes]
      operationId: addSource
      summary: Add auditable source (client message, quote or production evidence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceInput'
      responses:
        '201':
          description: Immutable source with digest saved; relevant edits stale prior assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAcceptanceReceipt'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/changes/{change_id}/assess:
    parameters:
      - $ref: '#/components/parameters/ChangeId'
    post:
      tags: [changes]
      operationId: assessChange
      summary: Deterministically assess financial impact and feasibility
      responses:
        '200':
          description: Saved immutable impact assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /api/v1/changes/{change_id}/submit:
    parameters:
      - $ref: '#/components/parameters/ChangeId'
    post:
      tags: [approval]
      operationId: submitForApproval
      summary: Move a current READY_FOR_APPROVAL assessment to PENDING_APPROVAL
      responses:
        '200':
          description: Change ready for authorized internal decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        '409':
          $ref: '#/components/responses/Blocked'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/changes/{change_id}/decision:
    parameters:
      - $ref: '#/components/parameters/ChangeId'
    post:
      tags: [approval]
      operationId: decideChange
      summary: Single authorized internal approver decides on current assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: Authenticated human decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /api/v1/changes/{change_id}/customer-acceptance:
    parameters:
      - $ref: '#/components/parameters/ChangeId'
    post:
      tags: [approval]
      operationId: recordCustomerAcceptance
      summary: Sales records evidence of customer agreement matching approved terms
      description: Sales attests to evidence; this demo does not cryptographically verify customer identity or signatures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAcceptanceInput'
      responses:
        '201':
          description: Matching customer agreement recorded by authenticated sales user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /api/v1/changes/{change_id}/apply:
    parameters:
      - $ref: '#/components/parameters/ChangeId'
    post:
      tags: [approval]
      operationId: applyApprovedChange
      summary: Atomically apply V2 only after current internal approval and matching recorded customer agreement
      responses:
        '201':
          description: New approved order revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Handoff'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Authenticate token server-side; never trust role strings from request payload.
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ChangeId:
      name: change_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: Actor lacks role permission
    NotFound:
      description: Requested resource does not exist
    Blocked:
      description: State transition blocked or stale assessment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Invalid:
      description: Invalid input data
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ProductionStatus:
      type: string
      enum: [NOT_STARTED, IN_PRODUCTION, COMPLETED]
    Feasibility:
      type: string
      enum: [CONFIRMED, NOT_FEASIBLE, UNKNOWN]
    ChangeStatus:
      type: string
      enum: [DRAFT, ASSESSMENT_REQUIRED, PENDING_APPROVAL, INTERNALLY_APPROVED, REJECTED, APPLIED]
    Readiness:
      type: string
      enum: [READY_FOR_APPROVAL, NEEDS_DATA, CONFLICT]
    CreateOrder:
      type: object
      additionalProperties: false
      required: [product_code, quantity, unit_sales_price_kopeks, delivery_date, approved_source_id]
      properties:
        product_code:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        unit_sales_price_kopeks:
          type: integer
          minimum: 0
        unit_est_cost_kopeks:
          type: [integer, 'null']
          minimum: 0
        delivery_date:
          type: string
          format: date
        approved_source_id:
          type: string
          minLength: 1
    Order:
      allOf:
        - $ref: '#/components/schemas/CreateOrder'
        - type: object
          required: [id, revision, production_status, completed_quantity]
          properties:
            id:
              type: string
            revision:
              type: integer
              minimum: 1
            production_status:
              $ref: '#/components/schemas/ProductionStatus'
            completed_quantity:
              type: integer
              minimum: 0
    OrderRevision:
      type: object
      description: Snapshot of a formally approved order revision, never an unapproved proposal.
      required: [id, order_id, revision_number, product_code, quantity, unit_sales_price_kopeks, delivery_date, approved_source_id, created_at]
      properties:
        id:
          type: string
        order_id:
          type: string
        revision_number:
          type: integer
          minimum: 1
        product_code:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_sales_price_kopeks:
          type: integer
          minimum: 0
        unit_est_cost_kopeks:
          type: [integer, 'null']
          minimum: 0
        delivery_date:
          type: string
          format: date
        approved_source_id:
          type: string
        approved_change_id:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    ProductionReviewInput:
      type: object
      additionalProperties: false
      required: [production_status, completed_quantity, feasibility, note]
      properties:
        production_status:
          $ref: '#/components/schemas/ProductionStatus'
        completed_quantity:
          type: integer
          minimum: 0
        feasibility:
          $ref: '#/components/schemas/Feasibility'
        note:
          type: string
    ProductionReview:
      allOf:
        - $ref: '#/components/schemas/ProductionReviewInput'
        - type: object
          required: [id, order_id, order_revision, reviewer_id, recorded_at]
          properties:
            id:
              type: string
            order_id:
              type: string
            order_revision:
              type: integer
            reviewer_id:
              type: string
            recorded_at:
              type: string
              format: date-time
    ChangeInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
        requested_quantity:
          type: integer
          minimum: 1
        requested_unit_sales_price_kopeks:
          type: integer
          minimum: 0
        requested_unit_est_cost_kopeks:
          type: [integer, 'null']
          minimum: 0
        requested_delivery_date:
          type: string
          format: date
        one_time_change_cost_kopeks:
          type: [integer, 'null']
          minimum: 0
    Change:
      allOf:
        - $ref: '#/components/schemas/ChangeInput'
        - type: object
          required: [id, order_id, baseline_revision, status]
          properties:
            id:
              type: string
            order_id:
              type: string
            baseline_revision:
              type: integer
            status:
              $ref: '#/components/schemas/ChangeStatus'
    ChangeAnalyticsRow:
      type: object
      required: [id, order_id, status, baseline_revision, current_order_revision, requested_quantity]
      properties:
        id:
          type: string
        order_id:
          type: string
        status:
          type: string
        baseline_revision:
          type: integer
        current_order_revision:
          type: integer
        requested_quantity:
          type: [integer, 'null']
    ChangeAnalyticsResponse:
      type: object
      required: [total, by_status, unknown_count, filter, filtered_total, limit, items]
      properties:
        total:
          type: integer
          minimum: 0
        by_status:
          type: object
          description: All six recognized status buckets; unaffected by the detail filter.
          additionalProperties:
            type: integer
        unknown_count:
          type: integer
          minimum: 0
        filter:
          oneOf:
            - $ref: '#/components/schemas/ChangeStatus'
            - type: 'null'
        filtered_total:
          type: integer
          minimum: 0
        limit:
          type: integer
          enum: [25]
        items:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/ChangeAnalyticsRow'
    ChangeWorkflow:
      type: object
      description: Saved read-only proposal state; the server rechecks all conditions before any write.
      required: [id, order_id, baseline_revision, status, assessment, customer_accepted]
      properties:
        id:
          type: string
        order_id:
          type: string
        baseline_revision:
          type: integer
        status:
          $ref: '#/components/schemas/ChangeStatus'
        requested_quantity:
          type: [integer, 'null']
        assessment:
          oneOf:
            - $ref: '#/components/schemas/Assessment'
            - type: 'null'
        customer_accepted:
          type: boolean
    SourceInput:
      type: object
      additionalProperties: false
      required: [kind, name, content, quote]
      properties:
        kind:
          type: string
          enum: [APPROVED_ORDER, CLIENT_MESSAGE, PRICE_QUOTE, PRODUCTION_REPORT, CUSTOMER_ACCEPTANCE]
        name:
          type: string
        content:
          type: string
        quote:
          type: string
    Source:
      allOf:
        - $ref: '#/components/schemas/SourceInput'
        - type: object
          required: [id, sha256, recorded_at]
          properties:
            id:
              type: string
            sha256:
              type: string
            recorded_at:
              type: string
              format: date-time
    Assessment:
      type: object
      required: [change_id, readiness, fingerprint, issues, old_revenue_kopeks, new_revenue_kopeks, delta_revenue_kopeks]
      properties:
        change_id:
          type: string
        readiness:
          $ref: '#/components/schemas/Readiness'
        fingerprint:
          type: string
        issues:
          type: array
          items:
            type: string
        old_revenue_kopeks:
          type: integer
        new_revenue_kopeks:
          type: [integer, 'null']
        delta_revenue_kopeks:
          type: [integer, 'null']
        delta_est_contribution_kopeks:
          type: [integer, 'null']
    DecisionInput:
      type: object
      additionalProperties: false
      required: [action, assessment_fingerprint, note]
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT]
        assessment_fingerprint:
          type: string
        note:
          type: string
    Decision:
      type: object
      required: [change_id, action, reviewer_id, assessment_fingerprint, decided_at]
      properties:
        change_id:
          type: string
        action:
          type: string
          enum: [APPROVE, REJECT]
        reviewer_id:
          type: string
        assessment_fingerprint:
          type: string
        decided_at:
          type: string
          format: date-time
    CustomerAcceptanceInput:
      type: object
      additionalProperties: false
      required: [quantity, unit_sales_price_kopeks, delivery_date, source_name, evidence_text]
      properties:
        quantity:
          type: integer
          minimum: 1
        unit_sales_price_kopeks:
          type: integer
          minimum: 0
        delivery_date:
          type: string
          format: date
        source_name:
          type: string
        evidence_text:
          type: string
    CustomerAcceptanceReceipt:
      type: object
      required: [id, change_id, recorded_at, recorded_by, assessment_fingerprint]
      properties:
        id:
          type: string
        change_id:
          type: string
        recorded_at:
          type: string
          format: date-time
        recorded_by:
          type: string
        assessment_fingerprint:
          type: string
    Handoff:
      type: object
      required: [order_id, change_id, approved_revision, approved_source_id]
      properties:
        order_id:
          type: string
        change_id:
          type: string
        approved_revision:
          type: integer
          minimum: 2
        approved_source_id:
          type: string
