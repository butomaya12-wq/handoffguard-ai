name: Full-stack tests — single command
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full-stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend and test dependencies
        run: python -m pip install -e ./backend 'pytest>=8,<10' httpx pyyaml

      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Confirm a failed suite fails the whole script
        run: |
          output="$(mktemp)"
          if HANDOFFGUARD_TEST_PYTHON=false bash scripts/test-all.sh >"$output" 2>&1; then
            echo "ERROR: test runner returned success for a failing backend command."
            cat "$output"
            exit 1
          fi
          if grep -q '^PASS: all checks completed successfully\.' "$output"; then
            echo "ERROR: test runner printed a false success marker."
            cat "$output"
            exit 1
          fi
          echo "PASS: failing backend command causes nonzero exit without a success marker."

      - name: Run backend tests, frontend tests and frontend build — one command
        run: bash scripts/test-all.sh
