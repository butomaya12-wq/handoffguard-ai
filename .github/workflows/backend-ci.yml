name: Backend unit and API tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test tools
        run: python -m pip install -e ./backend pytest httpx
      - name: Run isolated Gate 01 tests
        working-directory: backend
        run: python -m pytest -q
