name: PostgreSQL integration — isolated CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-24.04

    # Ephemeral synthetic CI-only database; never connects to Render, Neon or local Mac.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: handoffguard_ci
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: handoffguard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handoffguard_ci -d handoffguard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      HANDOFFGUARD_TEST_POSTGRES_URL: postgresql+psycopg://handoffguard_ci:integration_only@127.0.0.1:5432/handoffguard_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend PostgreSQL driver and integration test tools
        run: python -m pip install -e './backend[cloud]' 'pytest>=8,<10' httpx pyyaml

      - name: Run real PostgreSQL lifecycle and cloud-gate integration tests
        working-directory: backend
        run: python -m pytest -q integration_tests

      - name: Build cloud-only single-image Docker stack
        run: docker build --file Dockerfile.cloud --tag handoffguard-cloud-ci .

      - name: Verify packaged cloud app with disposable PostgreSQL and random credentials
        run: |
          env_file="$(mktemp)"
          chmod 600 "$env_file"
          trap 'docker rm -f handoffguard-cloud-ci >/dev/null 2>&1 || true; rm -f "$env_file"' EXIT

          python3 - "$env_file" <<'PY'
          import json
          import os
          import secrets
          import sys

          mapping = {
              secrets.token_urlsafe(48): {"id": "cloud-ci-" + role, "role": role}
              for role in ("sales", "production", "approver")
          }
          values = {
              "HANDOFFGUARD_DATABASE_URL": os.environ["HANDOFFGUARD_TEST_POSTGRES_URL"],
              "HANDOFFGUARD_AUTH_TOKENS": json.dumps(mapping, separators=(",", ":")),
              "HANDOFFGUARD_DEMO_ACCESS_KEY": secrets.token_urlsafe(48),
              "HANDOFFGUARD_DEMO_COOKIE_SECRET": secrets.token_urlsafe(64),
              "PORT": "18080",
          }
          with open(sys.argv[1], "w", encoding="utf-8") as env_file:
              for k, v in values.items():
                  env_file.write(k + "=" + v + "\\n")
          PY

          docker run -d --network host --name handoffguard-cloud-ci \
            --env-file "$env_file" handoffguard-cloud-ci >/dev/null
          python3 scripts/cloud-smoke-ci.py "$env_file"
