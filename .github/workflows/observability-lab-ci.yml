name: Observability lab — isolated real metrics and spans
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HANDOFFGUARD_AUTH_TOKENS: '{"demo-sales":{"id":"sales-observability-ci","role":"sales"},"demo-production":{"id":"production-observability-ci","role":"production"},"demo-approver":{"id":"approver-observability-ci","role":"approver"}}'
    steps:
      - uses: actions/checkout@v4

      - name: Validate isolated lab Compose
        run: docker compose -f docker-compose.observability.yml config -q

      - name: Build and start the independent telemetry lab
        run: docker compose -f docker-compose.observability.yml up -d --build --wait --wait-timeout 240

      - name: Verify real synthetic API, Prometheus counters and Jaeger spans
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode

          payload = {
              "product_code": "SYNTHETIC-OBS-CI",
              "quantity": 100,
              "unit_sales_price_kopeks": 100000,
              "delivery_date": "2026-11-12",
              "approved_source_id": "synthetic-only",
          }
          base = "http://127.0.0.1:8082"
          req = Request(
              base + "/api/v1/orders",
              data=json.dumps(payload).encode(),
              headers={"Authorization": "Bearer demo-sales", "Content-Type": "application/json"},
              method="POST",
          )
          for attempt in range(20):
              try:
                  with urlopen(req, timeout=8) as response:
                      assert response.status == 201, response.status
                      assert json.load(response)["revision"] == 1
                  break
              except URLError:
                  if attempt == 19: raise
                  time.sleep(1)
          print("PASS: isolated local HandoffGuard V1 created through frontend proxy")

          prom_url = "http://127.0.0.1:9090/api/v1/query?" + urlencode({
              "query": 'handoffguard_business_operations_total{operation="createOrder",outcome="success"}',
          })
          def prometheus_verified():
              with urlopen(prom_url, timeout=5) as response:
                  data = json.load(response)
              assert data["status"] == "success", data
              return any(float(item["value"][1]) >= 1 for item in data["data"]["result"])
          for attempt in range(30):
              try:
                  if prometheus_verified(): break
              except URLError:
                  pass
              if attempt == 29: raise AssertionError("Prometheus did not scrape a real business counter")
              time.sleep(2)
          print("PASS: persisted Prometheus time series counts a real business request")

          jaeger_url = "http://127.0.0.1:16686/api/traces?" + urlencode({
              "service": "handoffguard-local-observability", "limit": 20,
          })
          def jaeger_verified():
              with urlopen(jaeger_url, timeout=5) as response:
                  data = json.load(response)
              spans = [span for trace in data.get("data", []) for span in trace.get("spans", [])]
              return any(span.get("operationName") == "createOrder" for span in spans)
          for attempt in range(30):
              try:
                  if jaeger_verified(): break
              except (URLError, ValueError):
                  pass
              if attempt == 29: raise AssertionError("Jaeger did not ingest an actual OTel createOrder span")
              time.sleep(2)
          print("PASS: Jaeger stored a real OpenTelemetry business span")
          PY

      - name: Debug lab logs on failure
        if: failure()
        run: docker compose -f docker-compose.observability.yml logs --no-color --tail=100

      - name: Stop only the isolated lab, keep unrelated resources untouched
        if: always()
        run: docker compose -f docker-compose.observability.yml down
