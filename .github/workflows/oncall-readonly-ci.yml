name: On-call prototype — safety and recovery tests
on:
  pull_request:

permissions:
  contents: read

jobs:
  safety-and-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic incident and recovery safety tests (no real Docker start)
        run: python3 -m unittest discover -s oncall/tests -v
      - name: Verify read-only detector and approval-gated CLI help
        run: |
          python3 -m oncall.detector --help
          python3 -m oncall.recovery --help
